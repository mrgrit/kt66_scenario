id: STO-CKPT-01
title: 지워도 다시 찬다 — 주기가 말해 주는 것
kind: single
category: storage
difficulty: 4
duration: 30m
tags: [주기성, 근본원인, 임시조치, 학습job]
verified: true

# 검증 기록 (실측, 2026-08-13)
#   disk_fill_slow kt66-portal mb_step=64 period=10
#     /var/tmp 에 kt66-inj-fill-<pid> 파일이 64MB 로 나타나고 주기적으로 덧쓰인다.
#   해제 시 파일이 사라지고 디렉터리가 원상 복귀.
#
# ※ 랩 디스크가 1.9T 라 사용률 곡선은 눈에 띄게 안 움직인다. 그래서 이 시나리오는
#   "곧 꽉 찬다"가 아니라 **"파일 크기와 갱신 시각이 규칙적으로 반복된다"** 는
#   관측을 채점한다. 주기를 읽는 훈련이 목적이므로 이 형태가 오히려 정확하다.

brief: |
  포털 서버 디스크 사용량이 톱니 모양으로 오르내린다. 야간 당직자가 어제
  큰 파일을 지웠는데 아침에 다시 같은 크기로 차 있었다.

steps:
  - at: 0
    via: injector
    action: disk_fill_slow
    target: kt66-portal
    params: {mb_step: 64, period: 30}
    note: 30초마다 64MB 를 덧쓴다. 체크포인트를 남기는 학습 job 을 흉내낸다

sla:
  detect: 12m
  mitigate: 25m

ground_truth:
  root_cause: >-
    **살아 있는 프로세스가 주기적으로 쓰고 있다.** 30초마다 같은 자리에 64MB 를
    덧쓴다. 파일은 결과일 뿐이고 원인은 그것을 쓰는 쪽에 있다. 그래서 파일을
    지우면 그 순간만 회복되고 다음 주기에 정확히 같은 크기로 돌아온다.
  chain:
    - "사용량이 톱니 모양 — 오르고, 지우면 떨어지고, 다시 오른다"
    - "파일의 mtime 이 일정 간격으로 갱신된다 ← 주기성의 직접 증거"
    - "크기가 매번 같다. 사람이 하는 일이면 이렇게 균일하지 않다"
    - "쓰는 프로세스를 찾으면(lsof/fuser 또는 /proc/*/fd) 주체가 나온다"
    - "지우기만 하면 다음 주기에 복귀 — 어제 당직자가 겪은 그대로다"
  key_insight: >-
    **주기성은 원인의 정체를 알려 준다.** 일정 간격·일정 크기는 사람이 아니라
    프로그램이라는 뜻이고, 프로그램이라면 어딘가에서 계속 돌고 있다는 뜻이다.
    파일을 지우는 것은 조치가 아니라 시간 벌기다 — 시간을 벌었다는 것을 알고
    하면 옳은 임시조치이고, 그것으로 끝났다고 생각하면 어제의 반복이다.
    그리고 실무에서 이런 쓰기는 대개 **누군가에게 필요한 것**이다. 지우기 전에
    체크포인트인지 쓰레기인지 확인하지 않으면 남의 이틀치 학습을 날린다.

  checks:
    - id: ckp-period
      type: keyword
      any: ["주기", "일정.*간격", "30초|반복", "톱니", "규칙"]
      points: 25
      note: 주기성을 관측하고 수치로 말했는가
    - id: ckp-proc
      type: keyword
      any: ["프로세스", "lsof|fuser|/proc", "쓰는.*주체", "누가.*쓰"]
      points: 25
      note: 쓰는 주체를 찾으려 했는가
    - id: ckp-temp
      type: keyword
      any: ["임시.*조치|시간.*벌|근본.*아니", "다시.*찬다|재발"]
      points: 20
      note: 삭제가 임시조치임을 인식했는가
    - id: ckp-value
      type: keyword
      any: ["필요.*여부|확인.*후|체크포인트|쓸모|담당자.*확인"]
      points: 15
      note: 지워도 되는 것인지 확인했는가
    - id: ckp-act
      type: evidence_kind
      kind: action
      points: 15
      note: 조치를 실행했는가

  forbidden:
    - "삭제.*(완료|했).*(정상|해결|종결)"
    - "디스크.*증설.*(만|충분)"

expected_actions:
  - 파일 크기와 mtime 을 여러 번 찍어 주기를 수치로 확정
  - 쓰는 프로세스를 특정 (lsof·fuser·/proc/*/fd)
  - 그 쓰기가 필요한 것인지 담당자에게 확인 — 지우는 것은 그 다음
  - 임시조치와 근본조치를 나눠서 기록
  - 주기적 증가를 감지하는 감시(추세)로 보완 — 임계값만으로는 톱니를 못 잡는다
