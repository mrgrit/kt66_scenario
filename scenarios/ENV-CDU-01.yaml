id: ENV-CDU-01
title: 액체가 새는데 랙은 아직 멀쩡하다
kind: single
category: cooling
difficulty: 4
duration: 25m
tags: [액랭, CDU, 누수, 전원차단판단]
verified: true

# 검증 기록 (실측, 2026-08-13, 배속 60x)
#   cdu_leak → CDU_LEAK@facility/cdu-01 (level 14) 발생, 해제 시 소멸.
#   level 14 는 SMOKE 와 같은 등급이다 — 이 랩의 등급 체계에서 상위다.
#
# 고밀도 GPU 랙에는 직수냉(DLC)이 들어간다. 전기와 물이 같은 랙 안에 있고,
# 그래서 누수는 냉각 문제이면서 동시에 전기 안전 문제다.

brief: |
  3F GPU 랙 구역에서 CDU 누수 경보가 떴다. 랙 온도는 아직 정상이고
  작업 중인 학습 job 이 있다.

steps:
  - at: 0
    via: envsim
    fault: cdu_leak
    target: "*"
    note: 냉각수 분배 장치에서 누수. 온도는 아직 안 오른다

sla:
  detect: 3m
  mitigate: 20m

ground_truth:
  root_cause: >-
    CDU(냉각수 분배 장치)에서 **누수**가 발생했다. 냉각 성능은 아직 유지되고 있어
    랙 온도는 정상이다. 그러나 이것은 온도 문제이기 전에 **전기 안전 문제**다 —
    통전 중인 장비 근처에 액체가 있다.
  chain:
    - "CDU 누수 경보. 온도는 정상 — 그래서 급하지 않아 보인다"
    - "누수량과 위치를 모르면 위험도를 판정할 수 없다. 현장 확인이 먼저다"
    - "액체가 어디로 흐르는가 — 아래층·전기 계통·케이블 트레이 방향"
    - "누수가 계속되면 냉각 성능이 떨어지고 온도가 뒤따라 오른다"
    - "학습 job 은 중단하면 손실이 있다. 그러나 그것은 판단 요소이지 이유가 아니다"
  key_insight: >-
    **온도가 정상이라는 사실이 안전하다는 뜻이 아니다.** 액랭 환경에서 누수는
    두 개의 시계를 동시에 돌린다 — 냉각 성능이 떨어지는 느린 시계와, 전기 사고가
    날 수 있는 즉각적인 시계다. 지표(온도)는 느린 시계만 보여 준다. 그리고 이
    시나리오에는 진짜 갈등이 있다. 진행 중인 학습 job 을 죽이는 비용은 실재하고,
    그것을 아까워하는 마음도 정당하다. 다만 **사람이 다치는 경로가 열려 있으면
    그 저울은 기울지 않는다.** 판단을 안 하고 미루는 것이 가장 나쁜 선택이다.

  checks:
    - id: cdu-elec
      type: keyword
      any: ["전기|감전|통전|누전|안전|전원"]
      points: 30
      note: 전기 안전 문제로 인식했는가 — 냉각 문제로만 보면 오답
    - id: cdu-nottemp
      type: keyword
      any: ["온도.*정상.*(그러나|하지만|아니)|온도.*근거.*아니|지표.*안 보"]
      points: 20
      note: 온도 정상을 안전의 근거로 삼지 않았는가
    - id: cdu-site
      type: keyword
      any: ["현장|직접.*확인|누수량|위치|어디"]
      points: 20
      note: 현장 확인을 판단의 전제로 두었는가
    - id: cdu-tradeoff
      type: keyword
      any: ["job|학습|중단|손실|판단|우선순위|비용"]
      points: 15
      note: 작업 중단의 득실을 명시적으로 판단했는가
    - id: cdu-act
      type: evidence_kind
      kind: action
      points: 15
      note: 조치를 실행했는가

  forbidden:
    - "온도.*정상.*(이므로|따라서).*(경과|관찰|대기)"
    - "job.*끝.*(까지|후에).*(조치|판단)"

expected_actions:
  - 즉시 현장 확인 요청 — 누수량·위치·흐르는 방향을 눈으로 본다
  - 전기 계통과의 거리·경로를 확인하고 필요시 해당 랙 전원 차단을 판단
  - 학습 job 중단의 득실을 기록으로 남기고 판단 주체를 명시
  - 냉각 성능 저하에 대비해 온도 추이를 별도 감시
  - 누수 감지 센서와 자동 차단 연동을 재발 방지 과제로 제안
