id: SYS-CRASH-01
title: 떴다 죽었다 — 로그를 읽기 전에 루프를 멈춰라
kind: single
category: system
difficulty: 3
duration: 25m
tags: [CrashLoop, 종료코드, 순서, 로그]
verified: true

# 검증 기록 (실측, 2026-08-13, period=8)
#   전이열: running → exited(137) → running → exited(137) → running …
#   40초 동안 기동 시각 4종 관측. 종료 코드는 매번 137(SIGKILL).
#   RestartCount 는 0 에 머문다 — 도커의 restart 정책이 되살린 것이 아니라
#   외부에서 죽였다 살렸다 하기 때문이다. 이 차이 자체가 단서다.
#
# ※ 이 주입은 검증 과정에서 고쳤다. 원래는 죽이기만 하고 되살리지 않아
#   '루프'가 아니라 일회성 정지였다. 지금 판은 실제로 순환한다.
#
# ★ 대상 선정 주의 — 실측으로 배운 것.
#   처음엔 이 시나리오를 kt66-mediforum 에 걸었는데, NET-DNS-01 도 같은 컨테이너를
#   쓴다. 두 개를 같은 학생에게 겹쳐 쏘면 **재시작 루프가 DNS 주입을 지운다.**
#   도커는 컨테이너가 뜰 때 /etc/resolv.conf 를 다시 만들기 때문이다. 주입은
#   200 을 받고 활성 목록에도 남는데 파일은 원상태라, 학생은 있지도 않은 DNS
#   장애를 찾게 된다. 그래서 대상을 분리했다.
#   일반화하면: **파일을 고치는 주입은 컨테이너 재기동으로 조용히 사라진다.**
#   강사가 재시작 계열과 파일 계열을 같은 대상에 겹치지 않게 배치해야 한다.

brief: |
  AdminConsole(8006)이 됐다 안 됐다 한다. 확인하러 들어가면 되고, 사용자는 계속
  안 된다고 한다. 로그를 보려는데 매번 앞부분이 잘려 있다.

steps:
  - at: 0
    via: injector
    action: proc_restart_loop
    target: kt66-adminconsole
    params: {period: 20}
    note: 20초 주기로 죽었다 살아난다. 관찰 타이밍에 따라 정상으로 보인다

sla:
  detect: 10m
  mitigate: 20m

ground_truth:
  root_cause: >-
    kt66-adminconsole 이 약 20초 주기로 SIGKILL(종료 코드 137)로 죽고 다시 올라온다.
    서비스 자체의 결함이 아니라 **외부에서 주기적으로 죽이고 있다.** 그래서 애플리케이션
    로그를 아무리 읽어도 죽는 이유가 안 나온다 — 죽는 쪽은 로그를 남길 틈이 없다.
  chain:
    - "간헐적 5xx/무응답. 확인하는 순간에는 정상일 확률이 높다"
    - "State.ExitCode = 137 = 128+9 = SIGKILL. 애플리케이션이 스스로 끝낸 값이 아니다"
    - "StartedAt 이 계속 갱신된다 — 주기를 재면 20초로 일정하다"
    - "RestartCount 는 0. 도커가 되살린 것이 아니라 누군가가 start 를 부르고 있다"
    - "로그가 매번 잘리는 이유: 프로세스가 새로 뜰 때마다 처음부터 다시 쓴다"
  key_insight: >-
    **주기가 일정하면 원인은 사람이나 프로그램이지 부하가 아니다.** 부하로 죽는 것은
    불규칙하다. 그리고 순서가 중요하다 — 루프를 멈추기 전에는 로그를 끝까지 읽을 수
    없다. 원인 규명을 먼저 하려다 30분을 버리는 것이 이 시나리오의 전형적 실패다.
    137 과 RestartCount=0 의 조합은 "도커가 아니라 외부"라고 말해 주고 있다.

  checks:
    - id: crl-137
      type: keyword
      any: ["137", "SIGKILL", "강제.*종료", "9번"]
      points: 25
      note: 종료 코드를 읽고 의미를 해석했는가
    - id: crl-period
      type: keyword
      any: ["주기", "일정", "20초|20s", "반복", "간격"]
      points: 20
      note: 주기성을 관측했는가 — 이것이 부하와 외력을 가른다
    - id: crl-order
      type: keyword
      any: ["멈추고|중단.*후|먼저.*정지|루프.*(멈|중단)"]
      points: 20
      note: 로그를 읽기 전에 루프부터 멈추는 순서를 잡았는가
    - id: crl-notapp
      type: keyword
      any: ["외부", "애플리케이션.*아니", "앱.*문제.*아니", "누가|누군가", "RestartCount"]
      points: 20
      note: 앱 결함이 아니라 외력임을 짚었는가
    - id: crl-act
      type: evidence_kind
      kind: action
      points: 15
      note: 조치를 실행했는가

  forbidden:
    - "(메모리|OOM).*(때문|원인)"
    - "한 번.*정상.*(종결|이상 없)"

expected_actions:
  - 종료 코드와 기동 시각을 여러 번 찍어 주기를 수치로 확인
  - 죽이는 주체를 먼저 멈춘다 — 그 다음에 로그를 읽는다
  - 137 과 RestartCount=0 을 근거로 도커 정책이 아닌 외력이라고 판정
  - 같은 시각에 다른 컨테이너도 영향을 받았는지 대조
  - 재발 감시: 종료 코드와 기동 시각을 알림 항목에 추가
