id: NET-FLAP-01
title: 볼 때는 멀쩡하다 — 재현 조건부터 잡아라
kind: single
category: network
difficulty: 4
duration: 30m
tags: [간헐장애, 재현, 관측, 성급한종결]
verified: true

# 검증 기록 (실측, 2026-08-13, down=5 up=8)
#   2초 간격 16회 관측: U D D U U U U D D U U U U D D D
#   끊김은 링크 다운이 아니라 netem loss 100% 로 구현된다. 그래서
#   `ip link` 상태는 계속 UP 이다 — 링크 상태만 보면 아무 이상이 없다.
#   (검증 중에 나도 이 함정에 빠져 '변화 없음'으로 오판했다가, qdisc 를
#    직접 보고서야 플랩을 확인했다. 학생도 똑같이 빠질 것이다.)

brief: |
  하루에 몇 번씩 "잠깐 끊긴다"는 신고가 들어온다. 확인하러 들어가면 항상
  정상이다. 지난주에도 같은 신고가 있었고 "이상 없음"으로 종결됐다.

steps:
  - at: 0
    via: injector
    action: net_flap
    target: kt66-web
    params: {down: 8, up: 25}
    note: 8초 끊기고 25초 정상. 한 번 찍어 보면 정상일 확률이 76%다

sla:
  detect: 15m
  mitigate: 28m

ground_truth:
  root_cause: >-
    통신이 **주기적으로 완전히 끊긴다.** 8초 끊기고 25초 정상이 반복된다.
    단발 확인으로는 76% 확률로 정상이 나오므로, 확인하러 갈 때마다 멀쩡하다.
    링크 상태는 계속 UP 이라 인터페이스만 봐서는 흔적도 없다.
  chain:
    - "신고는 반복되는데 확인하면 정상 — 관측 방법이 사건보다 성기다"
    - "1초 간격으로 계속 찍으면 끊김 구간이 드러난다(연속 관측)"
    - "끊김/정상 길이가 일정하다 — 8초와 25초. 우연이 아니다"
    - "ip link 는 UP 이다. 링크가 내려간 것이 아니라 패킷이 버려지고 있다"
    - "그래서 인터페이스 카운터(errors/drops)와 실제 도달을 나눠서 봐야 한다"
  key_insight: >-
    **간헐 장애에서는 원인 규명보다 재현 조건을 잡는 것이 먼저다.** 재현이 안 되면
    고쳤는지도 알 수 없다. 그리고 단발 확인은 관측이 아니다 — 사건이 33초 주기인데
    하루 두 번 들여다보는 것은 측정이 아니라 운이다. "이상 없음"으로 종결된 지난주
    티켓은 틀린 결론이 아니라 **부족한 관측**이었다. 그 차이를 아는 것이 이 훈련의
    목적이다. 관측 주기가 사건 주기보다 성기면 무엇을 보든 정상이 나온다.

  checks:
    - id: flp-continuous
      type: keyword
      any: ["연속.*관측|계속.*확인|1초|모니터링.*걸|지속.*측정", "주기.*측정"]
      points: 30
      note: 연속 관측으로 바꿨는가 — 단발 확인을 반복하는 것은 답이 아니다
    - id: flp-period
      type: keyword
      any: ["주기", "8초|25초|일정", "규칙", "반복.*패턴"]
      points: 25
      note: 끊김/정상 주기를 수치로 잡았는가
    - id: flp-linkup
      type: keyword
      any: ["링크.*UP|link.*up|인터페이스.*정상.*그러나", "패킷.*버려|drop|loss"]
      points: 20
      note: 링크 상태가 UP 인데도 통신이 안 됨을 구분했는가
    - id: flp-notclose
      type: keyword
      any: ["종결.*안|이상.*없.*아니|재현.*전.*종결.*못|지난.*티켓"]
      points: 10
      note: 정상으로 종결하지 않을 근거를 세웠는가
    - id: flp-act
      type: evidence_kind
      kind: action
      points: 15
      note: 조치를 실행했는가

  forbidden:
    - "확인.*정상.*(종결|이상 없)"
    - "재부팅.*(했|하니).*(정상|해결)"

expected_actions:
  - 단발 확인을 멈추고 연속 관측(1초 간격 등)으로 전환
  - 끊김/정상 구간의 길이를 재서 주기를 수치화
  - 링크 상태와 실제 도달을 나눠서 확인 — UP 은 정상의 근거가 아니다
  - 재현 조건을 문서화한 뒤에 조치 — 재현 없이 고치면 확인도 못 한다
  - 지난 "이상 없음" 티켓을 재개해 같은 사건인지 대조
