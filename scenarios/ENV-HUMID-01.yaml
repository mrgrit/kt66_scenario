id: ENV-HUMID-01
title: 온도만 보고 있었다 — 습도가 78%다
kind: single
category: cooling
difficulty: 2
duration: 20m
tags: [습도, 결로, 정전기, 감시항목]
verified: true

# 검증 기록 (실측, 2026-08-13, 배속 60x)
#   humidity_drift → HUMID_HIGH(level 5) 3건 (2F/aisle-A, 3F/aisle-B, 4F/aisle-C)
#     floors.2F.humidity_pct 43.4 → 78.0
#     floors.4F.humidity_pct 44.3 → 78.0
#   해제 시 원래 값으로 복귀. 온도 지표는 거의 움직이지 않는다.

brief: |
  습도 경보가 떴다. 온도는 전 층 정상이고 냉방 장비도 이상이 없다.
  "온도가 괜찮으니 급한 건 아니다"는 의견이 나온다.

steps:
  - at: 0
    via: envsim
    fault: humidity_drift
    target: "*"
    note: 습도가 43% 대에서 78% 로 오른다. 온도는 그대로다

sla:
  detect: 8m
  mitigate: 18m

ground_truth:
  root_cause: >-
    **상대습도가 관리 범위를 벗어났다.** 온도는 정상이므로 냉방 능력 문제가 아니라
    제습·가습 계통이나 외기 유입 쪽 문제다. 높은 습도는 결로와 부식을 부르고,
    반대로 낮으면 정전기를 부른다 — 양쪽 다 위험이다.
  chain:
    - "습도 78%. 데이터센터 권장 범위(대략 40~60%)를 크게 벗어났다"
    - "온도는 정상 — 냉방 능력의 문제가 아니다"
    - "여러 층에서 동시에 올랐다. 국소 문제가 아니라 공통 원인이다"
    - "외기 유입·제습 계통·수분 유입원 중 하나를 좁혀 들어가야 한다"
    - "결로가 생기면 전기 사고로 이어진다. 온도가 정상이어도 위험은 진행 중이다"
  key_insight: >-
    **환경 관리는 온도 하나가 아니다.** 온도는 가장 자주 보는 지표라서 정상이면
    안심하게 되지만, 습도는 다른 축이고 다른 사고로 이어진다. 높으면 결로와 부식,
    낮으면 정전기. 둘 다 서서히 진행하고 둘 다 장비를 상하게 한다. 그리고 여러
    구역에서 동시에 나타났다면 원인은 개별 장비가 아니라 공통 계통이나 외기다 —
    범위가 원인의 위치를 알려 준다. 입문 시나리오지만 "정상인 지표는 다른 지표의
    정상을 보증하지 않는다"는 원칙은 모든 난이도에 그대로 적용된다.

  checks:
    - id: hum-range
      type: keyword
      any: ["78|권장|범위|40|60|기준.*초과"]
      points: 25
      note: 기준 범위와 대조했는가
    - id: hum-risk
      type: keyword
      any: ["결로|부식|정전기|누전|장비.*손상"]
      points: 30
      note: 습도가 부르는 실제 위험을 알고 있는가
    - id: hum-scope
      type: keyword
      any: ["여러.*층|전 층|공통|범위|동시"]
      points: 20
      note: 발생 범위로 원인 위치를 좁혔는가
    - id: hum-act
      type: evidence_kind
      kind: action
      points: 15
      note: 조치를 실행했는가
    - id: hum-monitor
      type: keyword
      any: ["감시|알림|추이|항목.*추가"]
      points: 10
      note: 감시 항목을 점검했는가

  forbidden:
    - "온도.*정상.*(이므로|따라서).*(문제.*없|급하지)"

expected_actions:
  - 현재 습도를 권장 범위와 대조해 이탈 폭을 수치로 확인
  - 온도 정상과 습도 이탈이 양립함을 근거로 냉방 능력 문제를 배제
  - 발생 범위(층·아일)를 확인해 공통 원인인지 국소인지 판정
  - 제습 계통과 외기 유입 경로를 점검
  - 결로 발생 여부를 현장에서 직접 확인 (지표만으로는 안 보인다)
