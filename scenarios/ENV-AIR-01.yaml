id: ENV-AIR-01
title: 냉방은 정상인데 랙 상단만 뜨겁다
kind: single
category: cooling
difficulty: 3
duration: 25m
tags: [기류, 재순환, 블랭킹, 국소과열]
verified: true

# 검증 기록 (실측, 2026-08-13)
#   airflow_block → AIRFLOW_SHORT@2F/aisle-A/air (level 8),
#   경보 문구: "기류 부족 — 랙 상단 재순환 발생". 해제 시 소멸.
#   냉방 장비(chiller/CRAC) 상태는 정상 그대로 유지된다 — 이것이 핵심이다.

brief: |
  2F A 아일에서 기류 경보가 떴다. 냉방 장비는 전부 정상 가동 중이고
  공급 온도도 설정값대로다. 그런데 일부 랙 상단 온도가 높다.

steps:
  - at: 0
    via: envsim
    fault: airflow_block
    target: "*"
    note: 기류가 막힌다. 냉방 능력이 아니라 경로의 문제다

sla:
  detect: 8m
  mitigate: 22m

ground_truth:
  root_cause: >-
    냉방 능력이 아니라 **기류 경로**의 문제다. 찬 공기가 랙 앞면까지 충분히
    도달하지 못하고, 랙 뒤의 더운 공기가 위로 돌아 앞면으로 재순환한다. 그래서
    공급 온도는 정상인데 흡입 온도는 높다.
  chain:
    - "냉방 장비 정상, 공급 온도 정상 — 능력 문제가 아니다"
    - "그런데 특정 랙 상단만 뜨겁다. 전체가 아니라 국소다"
    - "재순환: 뒷면의 더운 공기가 랙 위로 넘어와 앞면으로 다시 들어간다"
    - "원인 후보 — 블랭킹 패널 누락, 케이블로 막힌 타공판, 컨테인먼트 개방, 필터 막힘"
    - "공급 온도와 흡입 온도의 차이를 재면 재순환 정도가 수치로 나온다"
  key_insight: >-
    **냉방은 '얼마나 차게 만드는가'와 '그 공기가 어디로 가는가'의 두 부분이다.**
    장비 지표는 앞부분만 보여 준다. 그래서 "냉방 정상"과 "랙이 뜨겁다"가 동시에
    참일 수 있고, 이때 원인은 거의 항상 경로에 있다. 해결도 대개 장비가 아니라
    블랭킹 패널·타공판·컨테인먼트 같은 값싼 것들이다. 그리고 국소 과열은 평균
    온도로는 안 보인다 — 아일 평균이 정상이어도 특정 랙 상단은 위험할 수 있다.
    측정 지점을 어디에 두느냐가 감시의 절반이다.

  checks:
    - id: air-path
      type: keyword
      any: ["기류|경로|재순환|순환|바람.*길"]
      points: 30
      note: 능력이 아니라 경로 문제임을 짚었는가
    - id: air-notcap
      type: keyword
      any: ["냉방.*정상|공급.*온도.*정상|능력.*아니|장비.*이상.*없"]
      points: 20
      note: 냉방 능력을 근거를 대고 배제했는가
    - id: air-cause
      type: keyword
      any: ["블랭킹|패널|타공|컨테인먼트|필터|케이블|막"]
      points: 20
      note: 구체적인 기류 방해 요인을 찾으려 했는가
    - id: air-measure
      type: keyword
      any: ["흡입|공급.*차이|델타|상단|측정.*지점|국소"]
      points: 15
      note: 측정 지점을 나눠서 봤는가
    - id: air-act
      type: evidence_kind
      kind: action
      points: 15
      note: 조치를 실행했는가

  forbidden:
    - "냉방.*정상.*(이므로|따라서).*(문제.*없|이상.*없)"
    - "냉방.*증설|장비.*교체.*필요"

expected_actions:
  - 공급 온도와 랙 흡입 온도를 각각 측정해 차이를 확인
  - 랙 상단·중단·하단을 나눠 재서 재순환 여부를 판정
  - 블랭킹 패널 누락·타공판 막힘·컨테인먼트 개방을 현장 점검
  - 값싼 조치(패널·타공판)부터 적용하고 효과를 재측정
  - 측정 지점을 랙 흡입면 기준으로 보완 (아일 평균은 국소 과열을 숨긴다)
