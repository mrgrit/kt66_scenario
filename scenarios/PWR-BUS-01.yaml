id: PWR-BUS-01
title: 부스바 탭오프 과부하 — 차단 직전이다
kind: single
category: power
difficulty: 3
duration: 20m
tags: [부스바, 탭오프, 차단임박, 랙증설]
verified: true

# 검증 기록 (실측, 2026-08-13, 배속 60x)
#   busway_trip → BUSWAY_TRIP(level 11) 2건 (bus-2f-a, bus-3f-b), 해제 시 소멸.
#   경보 문구는 "부스바 탭오프 과부하 — 차단 임박". 아직 떨어진 것이 아니라
#   떨어지기 직전이라는 뜻이고, 이 차이가 대응 시간을 만든다.

brief: |
  2F A 계통과 3F B 계통에서 부스바 탭오프 과부하 경보가 떴다. 아직 차단되지
  않았고 서비스도 정상이다. 지난주에 랙을 두 개 늘렸다.

steps:
  - at: 0
    via: envsim
    fault: busway_trip
    target: "*"
    note: 탭오프 용량을 넘는다. 차단은 아직 안 됐다

sla:
  detect: 4m
  mitigate: 18m

ground_truth:
  root_cause: >-
    부스바 **탭오프 단위 용량**을 초과했다. 건물 전체 용량이나 PDU 총량이 남아
    있어도, 그 탭오프에 걸린 랙들의 합이 그 지점의 정격을 넘으면 그 지점이 떨어진다.
    지난주 랙 증설이 이 지점의 합을 밀어 올렸을 가능성이 크다.
  chain:
    - "탭오프 2곳에서 과부하. 서비스는 정상 — 아직 차단되지 않았다"
    - "총 용량은 여유가 있다. 문제는 총량이 아니라 이 지점이다"
    - "해당 탭오프에 붙은 랙들의 합계를 내면 정격을 넘는다"
    - "지난주 증설이 어느 탭오프에 붙었는지 확인하면 시점이 맞아떨어진다"
    - "차단되면 그 계통의 랙이 한꺼번에 나간다 — 이중화가 없으면 서비스 정지다"
  key_insight: >-
    **전력 용량은 총량이 아니라 경로의 각 지점에서 따로 성립해야 한다.** 수전 →
    변압기 → 부스바 → 탭오프 → PDU → 랙으로 내려오면서 각 단계에 정격이 있고,
    가장 작은 것이 실제 한계다. 총량 여유를 근거로 "괜찮다"고 하는 것이 증설
    사고의 전형적 경로다. 그리고 이 경보는 **아직 안 떨어졌다**는 것이 핵심이다 —
    차단 전에 부하를 옮기면 무중단으로 끝나고, 떨어진 뒤에는 복구 작업이 된다.
    같은 사건인데 대응 시점에 따라 난이도가 다르다.

  checks:
    - id: bus-point
      type: keyword
      any: ["탭오프|지점|계통별|해당.*부스바|국소"]
      points: 30
      note: 총량이 아니라 지점 용량 문제임을 짚었는가
    - id: bus-sum
      type: keyword
      any: ["합계|합|랙.*합|정격.*대비|kW"]
      points: 20
      note: 해당 지점에 걸린 부하 합계를 확인했는가
    - id: bus-change
      type: keyword
      any: ["증설|추가|지난주|랙.*늘|변경"]
      points: 20
      note: 최근 변경과 연결지었는가
    - id: bus-before
      type: keyword
      any: ["차단.*전|임박|미리|무중단|떨어지기.*전"]
      points: 15
      note: 차단 전에 손쓰는 것의 가치를 인식했는가
    - id: bus-act
      type: evidence_kind
      kind: action
      points: 15
      note: 조치를 실행했는가

  forbidden:
    - "(전체|총).*용량.*여유.*(므로|따라서).*문제.*없"
    - "차단.*(되면|후에).*조치"

expected_actions:
  - 해당 탭오프에 물린 랙과 각 부하를 합산해 정격과 대조
  - 최근 증설 이력을 조회해 어느 탭오프에 붙었는지 확인
  - 차단 전에 부하를 다른 계통으로 이설하거나 비필수 부하를 줄인다
  - 이중화 여부를 확인 — 떨어졌을 때 무엇이 같이 나가는지 미리 안다
  - 증설 절차에 지점별 용량 검토를 넣도록 제안 (총량 검토만으로는 재발한다)
