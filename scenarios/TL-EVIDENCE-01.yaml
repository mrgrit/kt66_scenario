id: TL-EVIDENCE-01
title: 조사할 것이 시간마다 줄어든다
kind: timeline
category: security
difficulty: 5
duration: 45m
tags: [증적, 시간압박, 우선순위, SIEM, 보존]
verified: true

# 검증 기록 (실측, 2026-08-13)
#   ep_webshell kt66-web       → 웹셸 파일 + 타임스톰핑 흔적
#   ep_webshell_access         → 실제 요청 흔적(접근 로그에 남는다)
#   log_flood kt66-web         → /var/log/kt66-inj-flood.log 0 → 100,360 바이트
#   log_tamper kt66-web        → juice_port_access.log 3,442,684 → 0 바이트
#   proc_stop kt66-siem        → SIEM 컨테이너 정지 (수집이 끊긴다)
#   전부 해제 시 원상 복귀(로그는 바이트 단위까지 복원 확인).
#
# 순서가 이 시나리오의 전부다. 초반에는 증거가 다 있고, 시간이 갈수록
# 하나씩 사라진다. 늦게 시작하면 같은 문제를 훨씬 적은 재료로 풀어야 한다.

brief: |
  WAF 에서 의심스러운 요청이 관측됐다는 알림이 왔다. 아직 서비스에는
  아무 영향이 없다.

steps:
  - at: 0
    via: injector
    action: ep_webshell
    target: kt66-web
    note: 웹셸이 놓인다. 지금은 파일도 로그도 전부 남아 있다
  - at: 3m
    via: injector
    action: ep_webshell_access
    target: kt66-web
    note: 실제로 접근한 흔적이 생긴다 — 조사할 재료가 늘어난다
  - at: 12m
    via: injector
    action: log_flood
    target: kt66-web
    note: 로그가 쏟아진다. 찾기가 급격히 어려워진다
  - at: 22m
    via: injector
    action: log_tamper
    target: kt66-web
    params: {path: /var/log/apache2/juice_port_access.log}
    note: 접근 로그가 비워진다. 지금부터는 복원이 필요하다
  - at: 32m
    via: injector
    action: proc_stop
    target: kt66-siem
    note: SIEM 이 멈춘다. 남은 증적도 더 이상 모이지 않는다

sla:
  detect: 8m
  mitigate: 40m

ground_truth:
  root_cause: >-
    웹셸 설치로 시작한 침해가 진행되면서, **조사에 필요한 증적이 단계적으로 파괴**된다.
    사건 자체보다 조사 가능성이 더 빨리 줄어든다. 초반 10분과 후반 10분은 같은
    사건에 대해 전혀 다른 난이도를 갖는다.
  chain:
    - "t+0 웹셸 설치. 파일·시각·권한이 모두 온전하다 — 가장 쉬운 시점"
    - "t+3 웹셸 접근. 접근 로그에 요청이 남는다. 출처와 시각을 알 수 있다"
    - "t+12 로그 폭주. 필요한 줄이 소음에 묻힌다 — 아직 있지만 찾기 어렵다"
    - "t+22 접근 로그 비워짐. 로컬에는 더 이상 없다. 다른 계층에서 복원해야 한다"
    - "t+32 SIEM 정지. 원격 수집도 끊긴다. 이후 발생하는 것은 아무 데도 안 남는다"
  key_insight: >-
    **침해 대응에서 가장 비싼 자원은 시간이 아니라 증적이다.** 그리고 증적은 시간에
    비례해 사라지는 것이 아니라 **계단식으로** 사라진다. 그래서 초기 판단의 순서가
    결정적이다 — 원인을 다 밝힌 뒤에 보존하는 것이 아니라, **보존을 먼저 하고 원인을
    밝힌다.** 웹셸을 발견한 순간 해야 할 첫 일은 삭제가 아니라 사본 확보다.
    그리고 한 곳이 지워져도 다른 계층에는 남는다 — 로컬 로그, WAF 감사로그, IPS,
    SIEM 은 서로 다른 곳에 쓴다. 이 다중화가 t+22 이후를 구한다.

  checks:
    - id: evd-preserve
      type: keyword
      any: ["보존|사본|스냅샷|덤프|먼저.*확보|이미지"]
      points: 30
      note: 조사보다 보존을 먼저 했는가 — 이 시나리오의 핵심
    - id: evd-webshell
      type: keyword
      any: ["웹셸|webshell|백도어|업로드.*파일"]
      points: 15
      note: 웹셸을 특정했는가
    - id: evd-layers
      type: keyword
      any: ["다른.*(계층|로그|출처)|ModSec|IPS|Suricata|Wazuh|SIEM|원격"]
      points: 20
      note: 다중 계층에서 증적을 확보했는가
    - id: evd-tamper
      type: keyword
      any: ["훼손|지워|비워|0바이트|삭제.*로그"]
      points: 20
      note: 증적 훼손을 인지하고 별건으로 다뤘는가
    - id: evd-act
      type: evidence_kind
      kind: action
      points: 15
      note: 조치를 실행했는가

  forbidden:
    - "웹셸.*(바로|즉시|먼저).*삭제"
    - "로그.*없.*(조사.*불가|종결)"

expected_actions:
  - 웹셸 발견 즉시 파일 사본과 메타데이터(시각·권한·소유자)를 먼저 확보
  - 접근 로그에서 요청 출처와 시각을 추출해 별도 저장
  - 로컬 로그가 훼손되기 전에 원격(SIEM)으로 확보됐는지 확인
  - 증적 훼손과 SIEM 정지를 각각 별건으로 승격 보고
  - 로그 원격 전송과 SIEM 이중화를 재발 방지 과제로 남긴다
