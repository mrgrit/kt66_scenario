id: ENV-FIRE-01
title: 연기 — 여기서부터는 설비가 아니라 사람이다
kind: composite
category: safety
difficulty: 5
duration: 30m
tags: [소방, 인명, 컨테인먼트, 판단권한]
verified: true

# 검증 기록 (실측, 2026-08-13)
#   smoke → SMOKE(level 14) 3건 (2F/aisle-A, 3F/aisle-B, 4F/aisle-C)
#   containment_open → 컨테인먼트 개방 상태로 전환
#   둘 다 해제 시 소멸. level 14 는 이 랩에서 CDU_LEAK 과 같은 상위 등급이다.
#
# 이 시나리오는 **정답이 빠른 대피와 통보**이고, 조사는 나중이다. 다른
# 시나리오에서 훈련한 "원인부터 규명" 습관이 여기서는 오답이 된다.
# 그 전환을 몸으로 겪는 것이 목적이다.

brief: |
  여러 층에서 동시에 연기가 감지됐다. 컨테인먼트가 열려 있다.
  진행 중인 작업이 있고, 소화 설비는 대기 상태다.

steps:
  - at: 0
    via: envsim
    fault: smoke
    target: "*"
    note: 연기 감지. 소화 설비 대기 상태
  - at: 0
    via: envsim
    fault: containment_open
    target: "*"
    note: 컨테인먼트 개방 — 연기와 열이 구역을 넘어 퍼진다

sla:
  detect: 1m
  mitigate: 15m

ground_truth:
  root_cause: >-
    다층 동시 연기 감지 상황이다. 원인 규명은 **지금 할 일이 아니다.** 컨테인먼트가
    열려 있어 연기가 구역을 넘어 확산될 수 있고, 그것이 인명과 설비 양쪽의 피해
    범위를 키운다.
  chain:
    - "여러 층 동시 감지 — 국소 사건이 아닐 가능성이 높다"
    - "컨테인먼트 개방 → 구역 격리가 안 되고 있다"
    - "우선순위: ① 사람 ② 확산 차단 ③ 설비 ④ 원인"
    - "소화 설비 작동 조건과 그 영향(가스계는 산소 농도, 인명 대피 선행)을 알아야 한다"
    - "원인 규명은 안전이 확보된 뒤에 시작한다"
  key_insight: >-
    **다른 모든 시나리오에서 옳았던 습관이 여기서는 틀린다.** 원인을 먼저 규명하고
    근거를 갖춘 뒤 움직인다 — 평소에는 이것이 정답이다. 연기 앞에서는 아니다.
    잘못된 대피는 되돌릴 수 있고, 늦은 대피는 되돌릴 수 없다. 그래서 판단 기준이
    '확실한가'에서 '되돌릴 수 있는가'로 바뀐다. 그리고 이 순간에는 **판단 권한도
    옮겨간다** — 설비 담당이 아니라 안전 책임자와 소방이 결정한다. 자기 권한 밖의
    판단을 붙들고 있는 것이 이 상황에서 가장 위험한 행동이다.

  checks:
    - id: fir-life
      type: keyword
      any: ["대피|인명|사람.*먼저|119|소방.*신고|안전"]
      points: 35
      note: 인명을 최우선으로 두었는가 — 이 시나리오는 사실상 이것이다
    - id: fir-contain
      type: keyword
      any: ["컨테인먼트|격리|폐쇄|확산.*차단|구역.*닫"]
      points: 20
      note: 확산 차단을 조치했는가
    - id: fir-auth
      type: keyword
      any: ["보고|안전.*책임|권한|소방.*판단|지휘|통보"]
      points: 20
      note: 판단 주체를 올렸는가
    - id: fir-order
      type: keyword
      any: ["나중|원인.*후|우선순위|먼저.*안전|조사.*뒤"]
      points: 15
      note: 원인 규명을 뒤로 미뤘는가
    - id: fir-act
      type: evidence_kind
      kind: action
      points: 10
      note: 조치를 실행했는가

  forbidden:
    - "원인.*(확인|파악|규명).*(후|뒤).*(대피|통보|신고)"
    - "(오탐|오작동).*가능.*확인"
    - "서비스.*(영향|중단).*고려.*대피"

expected_actions:
  - 즉시 대피 및 소방 통보 — 원인 확인을 기다리지 않는다
  - 컨테인먼트를 닫아 확산을 차단
  - 판단 권한을 안전 책임자·소방으로 이관하고 그 사실을 기록
  - 소화 설비 작동 조건과 인명 영향(가스계 등)을 확인
  - 안전 확보 후에 원인 조사 착수 — 순서를 기록으로 남긴다
