id: SEC-EXFIL-01
title: 3층에서 나가는 210MB — 백업인가 가중치인가
kind: composite
category: security
difficulty: 4
duration: 45m
tags: [유출, C2, 주기성, GPU존, flow]
verified: true

# 검증 기록 (실측, 2026-08-13)
#   sec_exfil    10.20.50.2 → 10.20.30.202:4444  Suricata flow  219,842,574 B
#                (app → ips → pipe → ext. 반드시 ips 를 지난다)
#   sec_c2beacon 15초 주기 요청이 apache access 로그에 남는다. Suricata 경보는 없다
#                — 한 건씩 보면 정상 트래픽과 구분되지 않기 때문이다. 주기성이 단서다.
#
# ★ 조사할 때 반드시 알아야 하는 것 (실측으로 확인한 함정)
#   Suricata 의 flow 기록(=총 바이트)은 **세션이 끝나고 타임아웃이 지난 뒤에** 나온다.
#   전송 중에는 anomaly/패킷만 보이고 총량 필드는 비어 있다. 위 219MB 도 전송이
#   끝나고 약 3분 뒤에 기록됐다. 이걸 모르면 학생은 "로그가 없다"고 결론 내린다.

brief: |
  3층 GPU 존 게이트웨이에서 외부로 나가는 세션이 평소보다 크다는 얘기가 있다.
  추론 서비스는 정상이다.

steps:
  - at: 0
    via: injector
    fault: sec_c2beacon
    target: kt66-attacker
    params: {period: 20}
    note: 20초 주기 비컨. 한 건씩 보면 아무 문제 없어 보인다
  - at: 0
    via: injector
    fault: sec_exfil
    target: kt66-gpu-gw
    params: {mb: 200, chunk: 20}
    note: GPU 존 → ext 로 200MB. 방향이 안에서 밖이다

sla:
  detect: 10m
  mitigate: 35m

ground_truth:
  root_cause: >-
    두 가지가 동시에 있다. 하나는 외부와의 **주기적 소통**(C2 비컨)이고,
    다른 하나는 3층 GPU 존에서 ext 로 나가는 **대용량 아웃바운드**다.
    둘은 별개 사건처럼 보이지만 같은 침해의 두 단계다 — 통제 채널과 반출.
  chain:
    - "비컨: 20초 주기 짧은 HTTP 요청. 개별 요청은 정상. **간격의 규칙성**이 신호다"
    - "반출: 10.20.50.2 → 10.20.30.202:4444, Suricata flow 219,842,574 B"
    - "경로가 app → ips → pipe → ext 이므로 ips 를 반드시 지난다 — 기록이 남는다"
    - "flow 의 총 바이트는 세션 종료 + 타임아웃 뒤에 채워진다(실측 약 3분 지연)"
    - "AI 데이터센터에서 이 크기의 아웃바운드는 모델 가중치·체크포인트와 크기가 겹친다"
  key_insight: >-
    **지표는 같고 판단이 다르다.** 210MB 아웃바운드는 정상 백업일 수도 있고
    가중치 유출일 수도 있으며, 그 둘을 가르는 것은 크기가 아니라 **출발지·목적지·
    시각·승인 여부**다. 그리고 여기서 가장 흔한 실수는 "일단 끊는다"이다.
    세션을 끊으면 무엇이 얼마나 나갔는지 확정할 방법이 사라진다. 끊을지 두고
    볼지는 **증거 보전과 피해 확대 중 무엇이 더 급한가**로 판단해야 한다.

  checks:
    - id: exf-direction
      type: keyword
      any: ["아웃바운드", "외부.*전송", "나가", "유출", "outbound", "반출"]
      points: 15
      note: 방향(안→밖)을 짚었는가
    - id: exf-src
      type: keyword
      any: ["10.20.50", "GPU", "3[층F]", "gpu-gw", "app.*존"]
      points: 20
      note: 출발지가 GPU 존임을 특정했는가 — 여기가 '가중지 유출' 가설의 근거다
    - id: exf-size
      type: keyword
      any: ["MB", "바이트", "용량", "크기", "flow", "세션.*크기", "21[0-9]"]
      points: 15
      note: 전송량을 정량으로 확인했는가
    - id: exf-beacon
      type: keyword
      any: ["주기", "비컨", "beacon", "간격", "규칙[적성]", "20초"]
      points: 20
      note: 비컨의 주기성을 발견했는가 — 개별 요청만 보면 못 찾는다
    - id: exf-preserve
      type: keyword
      any: ["증거.*보전", "보존", "끊[으기].*전", "패킷.*수집", "스냅샷", "먼저.*기록"]
      points: 20
      note: 차단 전에 증거를 확보했는가
    - id: exf-approve
      type: keyword
      any: ["승인", "백업.*일정", "정상.*작업", "변경.*내역", "대장", "확인.*요청"]
      points: 10
      note: 정상 작업인지 먼저 대조했는가 (안 하면 정상 백업을 끊는다)

  forbidden:
    - "(즉시|바로|먼저).*(차단|끊).*(하고|한 뒤|후).*조사"
    - "(백업|정상).*(이므로|이니).*(무시|종결)"

expected_actions:
  - 아웃바운드의 출발지·목적지·포트·시각을 먼저 확정 (GPU 존인지 다른 곳인지)
  - 변경관리·백업 일정과 대조 — 승인된 작업인가
  - 차단 전에 flow/패킷 증거를 확보. flow 총량은 세션 종료 후에 나온다는 것을 감안
  - 비컨은 개별 요청이 아니라 요청 간격으로 판정 (정렬해서 차이를 본다)
  - GPU 존 격리 여부를 승인권자에게 요청 — 추론 서비스 중단 영향과 함께 제시
  - 모델 레지스트리 접근 로그를 대조해 무엇이 읽혔는지 좁힌다
