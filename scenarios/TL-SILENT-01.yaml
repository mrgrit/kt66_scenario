id: TL-SILENT-01
title: 경보가 없는 고장 — 계량값만 조용히 준다
kind: timeline
category: power
difficulty: 5
duration: 40m
tags: [무경보, 계량, 예방점검, 뒤늦은대가]
verified: true

# 검증 기록 (실측, 2026-08-13, 배속 60x)
#   fuel_leak → **경보가 하나도 뜨지 않는다.** 대신 fuel.liters 가
#     3,963.6 → 3,766.7 로 줄고 hours_left 45.61 → 43.34 로 준다.
#     경보 목록에는 아무 변화가 없다 — 감시 화면만 보면 완전히 정상이다.
#   utility_fail  → 발전기 자동 기동, 연료 소모 시작
#   generator_fail → GEN_FAIL(13)
#   ※ 이 조합이 이 시나리오의 전부다. 새는 동안에는 아무도 모르고,
#     연료가 필요해지는 순간에 그 대가를 한꺼번에 치른다.

brief: |
  정기 점검일이다. 특별한 경보는 없다. 감시 화면은 전부 초록색이다.
  점검 항목에는 "발전기 연료량 확인"이 있다.

steps:
  - at: 0
    via: envsim
    fault: fuel_leak
    target: "*"
    note: 연료가 샌다. 경보는 뜨지 않는다 — 계량값만 준다
  - at: 12m
    via: envsim
    fault: utility_fail
    target: "*"
    note: 수전 상실. 이제 연료가 실제로 필요해진다
  - at: 22m
    via: envsim
    fault: generator_fail
    target: "*"
    note: 발전기 정지

sla:
  detect: 12m
  mitigate: 35m

ground_truth:
  root_cause: >-
    **연료 누출이 경보 없이 진행됐다.** 감시 시스템은 임계값을 넘는 것만 알리는데,
    누출은 임계값 아래에서 천천히 줄이므로 아무 알림도 발생하지 않는다. 수전이
    끊겨 발전기가 필요해진 시점에야 남은 연료가 부족하다는 사실이 드러난다.
  chain:
    - "t+0~12 아무 경보 없음. 연료 계량값만 서서히 감소 — 추세를 봐야 보인다"
    - "t+12 수전 상실. 발전기 기동. 이제 연료 소모가 시작된다"
    - "t+12 이 시점에 '유지 가능 시간'을 계산하면 평소보다 짧다는 것이 드러난다"
    - "t+22 발전기 정지. 남은 것은 배터리뿐이고 시간이 훨씬 짧다"
    - "돌아보면 신호는 t+0 부터 있었다. 경보가 없었을 뿐이다"
  key_insight: >-
    **경보가 없다는 것은 정상이라는 뜻이 아니라 임계값을 안 넘었다는 뜻이다.**
    임계 감시는 급변에 강하고 서서히 나빠지는 것에 약하다. 누출·마모·오염·용량
    잠식은 전부 후자다. 그래서 운영에는 두 종류의 감시가 필요하다 — 임계값과
    **추세**다. 그리고 정기 점검의 값어치가 여기 있다. 경보가 대신해 주지 못하는
    것을 사람이 눈으로 확인하는 절차이고, 그것을 형식적으로 넘기면 이 시나리오가
    된다. 점검표의 "연료량 확인"은 숫자를 적는 칸이 아니라 **지난번과 비교하는 칸**이다.

  checks:
    - id: sil-trend
      type: keyword
      any: ["추세|감소|줄어|변화.*추이|이전.*대비|비교"]
      points: 30
      note: 경보가 아니라 추세를 봤는가 — 이 시나리오의 핵심
    - id: sil-noalarm
      type: keyword
      any: ["경보.*없|알림.*없|임계.*아래|무경보|조용"]
      points: 20
      note: 경보 부재가 정상의 근거가 못 됨을 짚었는가
    - id: sil-runtime
      type: keyword
      any: ["유지.*시간|hours_left|남은.*시간|계산|부족"]
      points: 20
      note: 유지 가능 시간을 계산해 부족을 확인했는가
    - id: sil-cause
      type: keyword
      any: ["누출|샌|누유|leak|새고"]
      points: 15
      note: 누출을 원인으로 특정했는가
    - id: sil-act
      type: evidence_kind
      kind: action
      points: 15
      note: 조치를 실행했는가

  forbidden:
    - "경보.*없.*(므로|어서).*정상"
    - "점검.*(이상 없|완료).*종결"

expected_actions:
  - 점검 시 값을 적는 데서 그치지 않고 지난 값과 비교해 추세를 확인
  - 연료량으로 유지 가능 시간을 계산해 기준과 대조
  - 누출 지점을 찾고 안전 조치 (연료는 화재 위험이기도 하다)
  - 수전 상실 시점에 남은 유지시간을 재계산해 부하 축소를 판단
  - 임계 감시에 더해 추세 감시(감소율)를 감시 항목으로 추가
