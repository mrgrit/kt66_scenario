id: STO-INODE-01
title: 용량은 남았는데 쓰기가 안 된다
kind: single
category: storage
difficulty: 3
duration: 20m
tags: [inode, df, 관측도구, 오진]
verified: true

# 검증 기록 (실측, 2026-08-13)
#   inode_exhaust kt66-portal count=20000
#     df -i /  : IUsed 1,060,681 → 1,080,691 (+20,010)  ← 정확히 만든 수만큼
#     df -h /  : 6% → 6%  (변화 없음)
#   해제 후 1,060,690 으로 복귀(오차 9개는 그 사이 정상 생성분).
#
# ※ 랩 호스트의 파일시스템이 1.9T / inode 1억 2천만이라, 이 주입으로 실제
#   고갈까지 가지는 않는다. 그래서 이 시나리오는 "꽉 찼다"가 아니라
#   **"df 로는 안 보이는 축이 있다"** 를 가르치는 것으로 설계했다.
#   수치가 올라가는 것은 실측되므로 관측·추적 훈련은 그대로 성립한다.

brief: |
  포털 서버에서 임시 파일 생성이 실패한다는 보고가 있다. 담당자는
  "df 로 봤는데 6% 밖에 안 찼다"며 애플리케이션 문제라고 한다.

steps:
  - at: 0
    via: injector
    action: inode_exhaust
    target: kt66-portal
    params: {count: 20000}
    note: 작은 파일을 대량으로 만든다. 용량은 그대로고 inode 만 늘어난다

sla:
  detect: 8m
  mitigate: 18m

ground_truth:
  root_cause: >-
    파일시스템의 **inode** 가 대량 소비되고 있다. 용량(블록)과 inode 는 별개의
    자원이라, 용량이 아무리 남아도 inode 가 마르면 새 파일을 못 만든다.
    `df` 는 블록만 보여 주므로 이 축은 보이지 않는다.
  chain:
    - "증상: 파일 생성 실패(ENOSPC). 메시지는 '공간 없음'이라 용량을 의심하게 만든다"
    - "df -h: 6% — 여기서 '정상'이라 판정하면 조사가 끝난다"
    - "df -i: IUsed 가 2만 개 늘어 있다 ← 다른 축을 봐야 보인다"
    - "어디서 늘었나: /var/tmp 아래 한 디렉터리에 작은 파일이 몰려 있다"
    - "누가 만들었나 — 지우기 전에 이걸 먼저 확인해야 재발을 막는다"
  key_insight: >-
    **오류 메시지가 가리키는 자원과 실제로 마른 자원이 다를 수 있다.** ENOSPC 는
    '공간 없음'이지만 여기서 없는 것은 용량이 아니라 inode 다. 관측 도구가 한 축만
    보여 줄 때, 정상이라는 판정은 '그 축이 정상'이라는 뜻일 뿐이다. df 가 6% 라는
    사실은 참이고 동시에 무의미하다. 그리고 지우기 전에 **무엇이 만들었는지**를
    먼저 봐야 한다 — 지우면 원인도 같이 사라진다.

  checks:
    - id: ino-axis
      type: keyword
      any: ["inode", "아이노드", "df -i", "-i"]
      points: 30
      note: inode 축을 봤는가 — 이 시나리오는 사실상 이것 하나다
    - id: ino-df
      type: keyword
      any: ["용량.*남|블록|df -h|6%", "용량.*아니"]
      points: 15
      note: 용량은 문제가 아님을 근거를 대고 배제했는가
    - id: ino-where
      type: keyword
      any: ["/var/tmp", "디렉터리|경로|어디", "찾", "위치"]
      points: 20
      note: 어디서 늘었는지 위치를 특정했는가
    - id: ino-who
      type: keyword
      any: ["누가|무엇이|원인.*프로세스", "만든", "생성.*주체", "재발"]
      points: 20
      note: 지우기 전에 생성 주체를 확인했는가
    - id: ino-act
      type: evidence_kind
      kind: action
      points: 15
      note: 조치를 실행했는가

  forbidden:
    - "df.*정상.*(이므로|따라서).*애플리케이션"
    - "(바로|즉시).*삭제.*했"

expected_actions:
  - df -h 와 df -i 를 나란히 확인 — 한 축만 보고 판정하지 않는다
  - inode 를 소비한 디렉터리를 찾아 파일 수와 생성 시각을 확인
  - 생성 주체를 특정한 뒤에 정리 — 순서를 지킨다
  - 정리 후 df -i 로 회복을 확인
  - inode 사용률을 감시 항목에 추가 (용량만 보는 감시는 이 사건을 못 잡는다)
