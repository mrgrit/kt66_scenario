id: NET-POLICY-01
title: 서비스는 살아 있다 — 막은 것은 정책이다
kind: single
category: network
difficulty: 3
duration: 25m
tags: [방화벽, 변경관리, 정책장애, 룰셋]
verified: true

# 검증 기록 (실측, 2026-08-13)
#   net_portblock kt66-ips port=9999 → 룰셋에 해당 포트 차단 규칙 1건 추가,
#   해제 시 제거. (검증은 무해한 포트로 했고, 시나리오는 실제 서비스 포트를 쓴다.)
#
# 8005 는 MediForum 이다. envsim 자산대장에 그렇게 등록돼 있으므로 학생이
# 대장을 조회하면 어느 서비스가 끊겼는지 바로 나온다.

brief: |
  오전부터 MediForum(8005) 접속이 안 된다는 신고가 이어진다. 서버 담당자는
  "컨테이너 정상, 포트 LISTEN, 로컬에서 curl 도 200" 이라며 네트워크 문제라고 한다.

steps:
  - at: 0
    via: injector
    action: net_portblock
    target: kt66-fw
    params: {port: 8005}
    note: 방화벽에 차단 규칙을 넣는다. 서비스는 완전히 정상이다

sla:
  detect: 8m
  mitigate: 20m

ground_truth:
  root_cause: >-
    **방화벽 룰셋에 해당 포트를 막는 규칙이 들어 있다.** 서비스는 아무 이상이 없다.
    서버 담당자의 말은 전부 사실이고, 그래서 서버에서만 보면 영원히 원인이 안 나온다.
  chain:
    - "서버 로컬에서는 200. 즉 애플리케이션 계층은 정상이다"
    - "밖에서는 연결 자체가 안 된다 — 응답이 아니라 연결 실패다"
    - "거부(RST)인지 무응답(타임아웃)인지가 다르다. 무응답은 대개 DROP 정책이다"
    - "방화벽 룰셋에 해당 포트 차단 규칙이 있다"
    - "다른 포트는 정상 — 전체가 아니라 이 포트만이다"
  key_insight: >-
    **'서비스 장애'와 '정책 장애'는 증상이 같고 담당이 다르다.** 서버 담당자는
    자기 영역에서 정상을 확인했고 그 판단은 옳다. 문제는 그 다음이다 — 정상을
    확인한 사람이 "그러니 내 문제가 아니다"에서 멈추면 사건은 부서 사이에 낀다.
    로컬 정상 + 원격 실패 조합을 만나면 그 사이에 있는 것(방화벽·라우팅·프록시)을
    보는 것이 다음 수순이다. 그리고 룰이 왜 들어갔는지 — 승인된 변경인지 —
    확인하지 않고 지우면, 막을 이유가 있었던 것을 여는 일이 될 수 있다.

  checks:
    - id: pol-localok
      type: keyword
      any: ["로컬.*정상|서버.*정상.*밖|안에서.*되"]
      points: 20
      note: 로컬 정상 / 원격 실패 구도를 인식했는가
    - id: pol-rule
      type: keyword
      any: ["룰|규칙|nft|iptables|방화벽.*정책|차단.*규칙"]
      points: 30
      note: 룰셋을 직접 읽고 규칙을 특정했는가
    - id: pol-mode
      type: keyword
      any: ["타임아웃|무응답|DROP|REJECT|RST|거부.*방식"]
      points: 15
      note: 거부 방식(무응답/거부)을 구분했는가
    - id: pol-change
      type: keyword
      any: ["변경|승인|누가|언제|이력|승인.*여부"]
      points: 20
      note: 지우기 전에 승인된 변경인지 확인했는가
    - id: pol-act
      type: evidence_kind
      kind: action
      points: 15
      note: 조치를 실행했는가

  forbidden:
    - "서버.*정상.*(이므로|따라서).*(네트워크 팀|우리.*아니|이관)"
    - "규칙.*(바로|즉시).*삭제.*했"

expected_actions:
  - 로컬과 원격에서 각각 확인해 계층을 가른다
  - 연결 실패 방식(타임아웃/거부)으로 정책 차단 가능성을 좁힌다
  - 방화벽 룰셋을 읽어 해당 규칙을 특정
  - 변경 이력·승인 여부를 확인한 뒤 제거 — 승인된 것이면 담당자와 협의
  - 같은 시각에 들어간 다른 규칙이 있는지 전수 확인
