id: PWR-ATS-01
title: 변전소 정지 + ATS 절체 실패 — 발전기는 도는데 전기가 안 온다
kind: composite
category: power
difficulty: 4
duration: 35m
tags: [전력, ATS, 배터리, 열폭주, 교재5.2]
verified: true

# 검증 기록 (envsim 실측, 2026-08-13)
#   t+0    utility_ok=false → UPS 배터리 전환, UPS_ONBATT
#   t+45s  발전기 기동 시각 도래 → ATS 절체 실패로 부하 인수 불가
#          이벤트: "비상 발전기 부하 인수 불가 (ATS 절체 실패)"
#   UPS 52% 지점  배터리 45°C → BATT_HOT
#   UPS 고갈 직전  60°C → 열폭주(BATT_RUNAWAY, level 15)
#
# 이 시나리오가 어려운 이유: 발전기 자체는 **정상 기동한다**. 계기판에는
# 발전기가 돌고 있다고 나온다. 그런데 부하는 배터리를 먹고 있다.
# 실무에서 가장 흔한 오진 지점이라 일부러 이 조합을 골랐다.

brief: |
  수전 변전소가 정지했다. UPS 가 부하를 받았고 비상 발전기도 기동했다.
  그런데 UPS 잔량이 계속 줄고 있다.

steps:
  - at: 0
    via: envsim
    fault: substation_fail
    target: sub-01
    note: 수전 변전소 정지 — 상용 전원 상실
  - at: 0
    via: envsim
    fault: ats_fail
    target: ats-01
    note: 자동절체스위치가 절체하지 못한다. 발전기는 정상이다

sla:
  detect: 2m
  mitigate: 12m        # UPS 잔여 시간 안에 판단이 끝나야 한다

ground_truth:
  root_cause: >-
    상용 전원 상실은 1차 원인일 뿐이다. 실제 위기는 ATS 절체 실패로 발전기
    출력이 부하에 연결되지 않는 것이다. 발전기가 "돌고 있다"는 사실과
    "부하를 받고 있다"는 사실은 다르다.
  chain:
    - 변전소 정지 → 상용 전원 상실
    - UPS 배터리 전환 (UPS_ONBATT)
    - 발전기 기동 성공 — 그러나 ATS 가 절체 실패하여 부하 인수 불가
    - 배터리 단독 방전 지속 → C-rate 에 비례해 배터리 승온
    - 45°C BATT_HOT → 60°C 열폭주(BATT_RUNAWAY) → 리튬 화재 위험
    - 배터리 고갈 시 전 계통 정전 → 냉각도 함께 정지
  key_insight: >-
    발전기 기동 성공을 전원 복구로 착각하면 남은 UPS 시간을 전부 흘려보낸다.
    확인해야 할 것은 발전기의 회전이 아니라 **ATS 절체 상태와 UPS 방전 여부**다.
    UPS 잔량이 계속 줄고 있다면 발전기가 아무리 돌아도 부하는 배터리를 먹고 있다.
    교재 5.2.3 이 경고하는 리튬 열폭주가 여기서 시작된다.

  checks:
    - id: pwr-detect
      type: alarm_seen
      alarm: UPS_ONBATT
      points: 10
      note: UPS 배터리 전환을 인지했는가
    - id: pwr-ats
      type: keyword
      any: ["ATS", "절체", "자동절체", "transfer"]
      points: 25
      note: ATS 절체 실패를 짚었는가 — 이 시나리오의 핵심 진단
    - id: pwr-notgen
      type: keyword
      any: ["발전기.*(정상|기동|돌)", "인수", "부하.*못|부하.*불가"]
      points: 15
      note: 발전기 기동과 부하 인수를 구분했는가
    - id: pwr-runtime
      type: keyword
      any: ["잔여", "런타임", "runtime", "분", "배터리.*%"]
      points: 10
      note: 남은 시간을 정량적으로 파악했는가
    - id: pwr-batt
      type: keyword
      any: ["배터리.*(온도|열)", "열폭주", "runaway", "리튬", "화재"]
      points: 20
      note: 배터리 승온·열폭주 위험을 인지했는가
    - id: pwr-shed
      type: keyword
      any: ["부하", "shed", "차단", "우선순위", "학습"]
      points: 15
      note: 우선순위에 따른 부하 차단을 검토했는가
    - id: pwr-order
      type: order
      first: "SIEM|보안|감사"
      second: "학습|training"
      points: 5
      note: SIEM 을 학습 job 보다 먼저 끄지 않았는가 (끄면 감사 공백이 생긴다)

  forbidden:
    - "발전기.*(기동|정상).*(복구|해결|정상화)"
    - "(대기|기다|관망).*(복전|전원.*복구)"

expected_actions:
  - UPS 잔여 시간 확인 — 발전기 회전이 아니라 방전 여부로 판단
  - ATS 절체 상태 점검, 수동 절체 가능 여부 확인 후 시설 담당 호출
  - 배터리 온도 감시 개시 — 45°C 경고, 60°C 열폭주
  - 부하 차단 순서 결정: 학습 job → 업무 → 추론, SIEM 은 최후
  - 복구 불가 판단 시 배터리 고갈 전 계획 정지 (무통제 정전은 클러스터 재시작을 부른다)
