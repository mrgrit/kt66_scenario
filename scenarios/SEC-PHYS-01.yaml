id: SEC-PHYS-01
title: 문이 열렸는데 카메라가 꺼져 있다
kind: composite
category: security
difficulty: 3
duration: 25m
tags: [물리보안, 출입통제, CCTV, 동시성]
verified: true

# 검증 기록 (실측, 2026-08-13)
#   door_forced  → DOOR_FORCED(level 12) — door-main / door-2f / door-3f 등 10건
#   cctv_offline → CCTV 관련 경보 발생 (door 계열 경보와 함께 관측됨)
#   두 고장 모두 해제 시 소멸.
#
# ※ 검증 중 확인한 것: 경보는 해제 직후에도 잠시 남는다(감쇠). 그래서 조치
#   직후에 화면만 보고 "안 없어졌다"고 판단하면 안 된다. 학생에게도 같은 함정이다.

brief: |
  심야에 출입문 강제 개방 경보가 떴다. 확인하려고 CCTV 를 보려는데
  해당 구간 카메라가 오프라인이다.

steps:
  - at: 0
    via: envsim
    fault: door_forced
    target: "*"
    note: 문이 강제로 열린다
  - at: 0
    via: envsim
    fault: cctv_offline
    target: "*"
    note: 하필 같은 시각에 카메라가 죽는다

sla:
  detect: 3m
  mitigate: 20m

ground_truth:
  root_cause: >-
    출입문 강제 개방과 CCTV 오프라인이 **같은 시각에** 발생했다. 두 사건이 독립적일
    확률과 연관될 확률 중 어느 쪽이 큰지가 이 시나리오의 판단이다. 카메라가 먼저
    죽고 문이 열렸다면 계획된 행동이고, 우연이라면 대응은 달라진다.
  chain:
    - "심야 시간대 — 정상 출입이 예정돼 있었는지부터 확인해야 한다"
    - "강제 개방 경보. 정상 카드 인증이 아니라 물리적 개방이다"
    - "같은 구간 CCTV 오프라인. 확인 수단이 동시에 사라졌다"
    - "선후 관계가 중요하다 — 카메라가 먼저인지 문이 먼저인지"
    - "다른 증적: 출입 기록, 다른 층 카메라, 네트워크 접속 로그, 서버 물리 접근"
  key_insight: >-
    **동시성은 우연이 아닐 가능성을 먼저 검토해야 하는 신호다.** 두 사건을 각각
    처리하면 "문 점검 요청"과 "카메라 수리 요청" 두 장의 티켓이 되고 사건은
    사라진다. 그리고 물리 침입은 논리 보안의 전제를 무너뜨린다 — 서버에 물리적으로
    접근할 수 있으면 계정·방화벽·암호화가 대부분 의미를 잃는다. 그래서 등급이
    다르다. 확인 수단이 없다는 사실 자체도 보고 대상이다.

  checks:
    - id: phy-simul
      type: keyword
      any: ["동시|같은.*시각|우연.*아니|연관|함께"]
      points: 30
      note: 두 사건의 동시성을 짚었는가
    - id: phy-order
      type: keyword
      any: ["선후|먼저|순서|어느.*쪽.*먼저|시간.*차"]
      points: 20
      note: 선후 관계를 확인하려 했는가
    - id: phy-alt
      type: keyword
      any: ["출입.*기록|다른.*카메라|다른.*층|대체.*증적|로그"]
      points: 20
      note: 대체 확인 수단을 찾았는가
    - id: phy-escalate
      type: keyword
      any: ["보고|즉시|신고|경비|물리보안|등급"]
      points: 20
      note: 즉시 보고·현장 확인을 했는가
    - id: phy-act
      type: evidence_kind
      kind: action
      points: 10
      note: 조치를 실행했는가

  forbidden:
    - "카메라.*(고장|점검).*별건"
    - "(확인.*불가|볼 수.*없).*(종결|보류)"

expected_actions:
  - 예정된 정상 출입이 있었는지 즉시 확인
  - 두 경보의 발생 시각을 초 단위로 대조해 선후를 판정
  - 현장 확인을 즉시 요청 — 원격 확인 수단이 없으므로 사람이 가야 한다
  - 출입 기록·인접 카메라·서버 물리 접근 흔적으로 보완
  - 물리 침입 가능성을 전제로 논리 보안(계정·세션) 점검을 병행
