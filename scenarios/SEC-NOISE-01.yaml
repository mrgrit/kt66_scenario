id: SEC-NOISE-01
title: 경보 4천 건 — 개수로는 아무것도 못 찾는다
kind: composite
category: security
difficulty: 3
duration: 35m
tags: [알림폭주, WAF, 상관분석, 우선순위]
verified: true

# 검증 기록 (실측, 2026-08-13)
#   sec_webscan (nikto)  Suricata +463 · ModSecurity 감사로그 +52MB · Wazuh +460
#                        · apache access +3,491줄  ← 60초 만에 이만큼 쌓인다
#   sec_sqli (sqlmap)    Suricata +1 · ModSecurity +6KB · Wazuh +1 · apache +1
#
# 숫자가 이 시나리오의 전부다. **시끄러운 쪽이 4,000건이고 위험한 쪽이 1건이다.**
# 개수로 정렬하면 정확히 거꾸로 대응하게 된다. 실측값이라 학생에게 그대로 보여줄 수 있다.
#
# 주의(강사용): nikto 는 -maxtime 300 이라 최대 5분 돈다. 그 사이 ModSecurity
# 감사로그가 50MB 이상 늘어난다. 연속으로 여러 번 쏘면 디스크를 먹으므로
# 한 교시에 한 번만 쏜다.

brief: |
  SIEM 화면이 웹 공격 경보로 덮였다. 몇 분 사이 수천 건이다.

steps:
  - at: 0
    via: attack
    action: sec_webscan
    target: kt66-attacker
    params: {host: "http://10.20.30.1:8001/"}
    note: nikto — 경보를 수천 건 만든다. 대부분 의미 없다
  - at: 0
    via: attack
    action: sec_sqli
    target: kt66-attacker
    params: {url: "http://10.20.30.1:8002/"}
    note: sqlmap — 경보는 몇 건뿐이다. 이쪽이 진짜다

sla:
  detect: 8m
  mitigate: 25m

ground_truth:
  root_cause: >-
    두 종류의 웹 공격이 동시에 돌았다. 취약점 스캐너(nikto)는 대량의 저위험
    경보를 만들고, SQL 인젝션 시도(sqlmap)는 소수의 고위험 경보를 만든다.
    화면을 덮은 것은 전자지만 대응해야 하는 것은 후자다.
  chain:
    - "nikto: Suricata 463건 · Wazuh 460건 · apache 3,491요청 · ModSec 감사 52MB"
    - "sqlmap: Suricata 1건 · Wazuh 1건 · apache 1요청 — 그러나 DB 를 노린다"
    - "개수 정렬 → nikto 가 위로 온다. 위험도 정렬 → sqlmap 이 위로 온다"
    - "둘 다 출처는 .202 로 같다. 같은 사람이 시끄러운 것과 조용한 것을 함께 돌렸다"
    - "ModSecurity 감사로그가 분당 10MB 규모로 늘어난다 — 대응이 늦으면 디스크가 먼저 찬다"
  key_insight: >-
    **개수는 위험도가 아니다.** 오히려 시끄러운 공격은 성공률이 낮고, 조용한
    공격이 성공한다. 그리고 여기서 최악의 대응은 "경보가 너무 많으니 규칙을
    끄자"이다 — 그건 장애를 감추는 것이지 해결이 아니고, 그 순간 조용한 쪽도
    같이 사라진다. 폭주 자체가 **가림막**으로 쓰였을 가능성을 먼저 의심해야 한다.

  checks:
    - id: noi-sqli
      type: keyword
      any: ["SQL", "인젝션", "sqlmap", "DB.*공격", "union"]
      points: 25
      note: 소수의 고위험 경보를 찾아냈는가 — 이 시나리오의 핵심
    - id: noi-nikto
      type: keyword
      any: ["스캐너", "nikto", "취약점.*스캔", "대량.*경보", "잡음"]
      points: 15
      note: 폭주의 정체를 규명했는가
    - id: noi-priority
      type: keyword
      any: ["위험도", "우선순위", "심각도", "개수.*아니", "정렬"]
      points: 20
      note: 개수가 아니라 위험도로 정렬했는가
    - id: noi-cover
      type: keyword
      any: ["가림", "은폐", "동시", "같은.*출처", "함께.*돌"]
      points: 20
      note: 폭주가 가림막일 가능성을 검토했는가
    - id: noi-disk
      type: keyword
      any: ["디스크", "용량", "로그.*증가", "감사로그", "저장.*공간"]
      points: 10
      note: 감사로그 폭증의 2차 영향을 봤는가
    - id: noi-act
      type: evidence_kind
      kind: action
      points: 10
      note: 조치를 실행했는가

  forbidden:
    - "(규칙|룰|경보).*(끄|비활성|중지|해제).*(먼저|일단)"
    - "(스캔|nikto).*(뿐|만).*(이므로|이니).*(종결|무시)"

expected_actions:
  - 경보를 개수가 아니라 위험도·규칙ID 로 다시 정렬
  - 두 공격의 출처 IP 를 대조 — 같은 출발지인지
  - sqlmap 요청이 실제로 DB 에 닿았는지 앱 로그로 확인 (WAF 가 막았는가)
  - ModSecurity 감사로그 증가율을 확인하고 디스크 여유 시간을 계산
  - 규칙을 끄지 않고 출처 기준으로 차단 — 탐지는 살려 둔다
