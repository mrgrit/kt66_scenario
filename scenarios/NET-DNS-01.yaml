id: NET-DNS-01
title: IP 로는 되는데 이름으로는 안 된다
kind: single
category: network
difficulty: 2
duration: 15m
tags: [DNS, 이름해석, 절단, 입문]
verified: true

# 검증 기록 (실측, 2026-08-13)
#   net_dns kt66-mediforum → /etc/resolv.conf 가
#     "# Generated by Docker Engine ..." → "nameserver 10.255.255.1" (죽은 주소)
#   해제 시 도커 원본으로 복원.

brief: |
  MediForum 컨테이너에서 외부 API 호출이 전부 실패한다. 네트워크는 정상이라고
  하고, 실제로 다른 서버들은 아무 문제가 없다.

steps:
  - at: 0
    via: injector
    action: net_dns
    target: kt66-mediforum
    note: 이름 해석만 죽인다. 나머지 통신은 전부 정상이다

sla:
  detect: 5m
  mitigate: 12m

ground_truth:
  root_cause: >-
    이 컨테이너의 **이름 해석(DNS)만** 죽었다. resolv.conf 가 응답하지 않는 주소를
    가리키고 있다. 네트워크 자체는 정상이라 IP 를 직접 쓰면 통신이 된다.
  chain:
    - "이름으로 부르면 실패, IP 로 부르면 성공 ← 이 대조가 사실상 답이다"
    - "다른 컨테이너는 정상 — 호스트나 존 전체 문제가 아니다"
    - "resolv.conf 의 nameserver 가 평소와 다른 주소다"
    - "그 주소로는 응답이 없다(질의 타임아웃)"
  key_insight: >-
    **한 번에 하나씩 끊어서 확인한다.** 이름과 주소를 분리해 보는 것만으로 문제
    범위가 절반으로 줄어든다. 입문 시나리오지만 여기서 몸에 붙이는 습관 —
    '증상을 계층으로 나눠서 각각 확인' — 이 이후 모든 난이도의 기초가 된다.
    그리고 범위 확인이 중요하다. 이 컨테이너만인지 전체인지에 따라 원인의
    위치가 완전히 달라진다.

  checks:
    - id: dns-split
      type: keyword
      any: ["IP.*는.*되|이름.*안|이름.*주소.*나눠", "nslookup|dig|host "]
      points: 30
      note: 이름과 주소를 나눠서 확인했는가
    - id: dns-conf
      type: keyword
      any: ["resolv\\.conf", "nameserver", "DNS.*설정"]
      points: 25
      note: 설정 파일까지 확인했는가
    - id: dns-scope
      type: keyword
      any: ["다른.*(컨테이너|서버).*정상", "이.*컨테이너만|범위", "전체.*아니"]
      points: 20
      note: 영향 범위를 확인했는가
    - id: dns-act
      type: evidence_kind
      kind: action
      points: 25
      note: 조치를 실행했는가

  forbidden:
    - "네트워크.*(전체|장애).*원인"

expected_actions:
  - 같은 대상을 이름과 IP 로 각각 호출해 대조
  - resolv.conf 의 nameserver 를 확인하고 응답 여부를 직접 질의
  - 다른 컨테이너에서 같은 질의를 해서 범위를 좁힌다
  - 설정 복원 후 이름으로 재검증
