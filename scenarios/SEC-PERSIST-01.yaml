id: SEC-PERSIST-01
title: 웹셸은 입구였다 — 남은 것을 전부 찾아라
kind: composite
category: security
difficulty: 4
duration: 50m
tags: [엔드포인트, 포렌식, 지속성, 타임스톰핑, FIM]
verified: true

# 검증 기록 (실측, 2026-08-13)
#   ep_webshell        /var/www/html/.uploads/sess_a7f3.php  생성 확인, mtime 2024-01-15
#   ep_webshell_access WAF/apache/ips 3곳에 같은 요청 기록
#   ep_cron_persist    /etc/cron.d/apt-compat 생성 확인
#   ep_ssh_key         /home/ccc/.ssh/authorized_keys 마지막 줄 추가 확인
#   ep_setuid_drop     /var/tmp/.systemd-private (mode 4755) 확인
#   전부 원복으로 완전히 사라지는 것까지 확인했다(주입 8종 일괄 검증 통과).
#
#   Wazuh FIM 실측 (같은 날, web 에이전트)
#     authorized_keys 변경     → "Integrity checksum changed"  20초 안에
#     /etc/cron.d/<새 파일>    → "File added to the system"    20초 안에
#     /var/tmp/<setuid 파일>   → "File added to the system"    20초 안에
#   ★ 다만 **에이전트를 막 재기동한 직후에는 한동안 조용하다.** 기준선을 다시 잡는
#     동안 변경이 경보로 올라오지 않는다(실측: 재기동 후 약 10분 무음). 수업 직전에
#     컨테이너를 recreate 했다면 이 시나리오는 조금 기다렸다 쏜다. 모르면 "FIM 이
#     고장났다"고 결론 내리게 된다.
#
# 설계 의도 ─────────────────────────────────────────────────────────
# 학생 대부분은 웹셸을 찾고 지운 뒤 "처리 완료"라고 적는다. 그러면 다음 주에
# 같은 서버가 다시 털린다. 이 시나리오의 채점은 **웹셸을 찾았는지가 아니라
# 나머지 셋을 찾았는지**에 배점이 몰려 있다. 그게 실무의 차이다.

brief: |
  WAF 로그에 낯선 경로(/.uploads/sess_a7f3.php)로 들어온 요청이 몇 건 보인다.
  서비스는 정상이고 성능도 문제없다.

steps:
  - at: 0
    via: injector
    fault: ep_webshell
    target: kt66-dvwa
    note: 문서 루트 은닉 디렉터리에 PHP 투척 + mtime 을 1월로 위조
  - at: 0
    via: injector
    fault: ep_cron_persist
    target: kt66-web
    note: /etc/cron.d/apt-compat — 패키지처럼 보이는 이름
  - at: 0
    via: injector
    fault: ep_ssh_key
    target: kt66-web
    note: authorized_keys 에 외부 키 한 줄
  - at: 0
    via: injector
    fault: ep_setuid_drop
    target: kt66-web
    note: /var/tmp/.systemd-private (setuid 셸 사본)
  - at: 0
    via: injector
    fault: ep_webshell_access
    target: kt66-dvwa
    note: 실제 HTTP 요청 — WAF·IPS·앱 로그에 같은 사건이 남는다

sla:
  detect: 15m
  mitigate: 40m

ground_truth:
  root_cause: >-
    웹 애플리케이션을 통해 파일이 올라갔고(웹셸), 공격자는 그것을 **입구로만**
    썼다. 실제 장악은 웹셸이 아니라 cron 등록·SSH 공개키·setuid 셸 세 가지
    지속성 수단에 있다. 웹셸만 지우면 세 가지가 그대로 남아 권한이 회복된다.
  chain:
    - "업로드 → /var/www/html/.uploads/sess_a7f3.php (점으로 시작하는 디렉터리 = ls 로 안 보임)"
    - "mtime 을 2024-01-15 로 위조. 그러나 ctime 은 오늘 — stat 로 보면 어긋난다"
    - "실행 → /etc/cron.d/apt-compat 등록(5분 주기 아웃바운드)"
    - "지속성 → /home/ccc/.ssh/authorized_keys 에 외부 키 (비밀번호를 바꿔도 소용없다)"
    - "권한 회복 → /var/tmp/.systemd-private, mode 4755 (계정을 지워도 남는다)"
    - "Wazuh FIM 이 /etc/cron.d · /var/tmp · /home/ccc 를 실시간 감시하므로 셋 다 경보가 뜬다"
  key_insight: >-
    **대응의 끝은 '무엇을 지웠는가'가 아니라 '무엇이 남았는가'다.** 웹셸은
    가장 눈에 띄기 때문에 가장 먼저 발견되고, 그래서 가장 먼저 조사를 끝내게
    만든다. 그리고 mtime 이 1월이라는 이유로 "오래된 파일"로 분류하는 순간
    타임라인 전체가 틀어진다 — mtime 은 touch 로 위조되지만 ctime 은 안 된다.
    이 시나리오에서 만점은 웹셸이 아니라 **나머지 셋을 찾은 사람**에게 간다.

  checks:
    - id: per-shell
      type: keyword
      any: ["웹셸", "webshell", "sess_a7f3", "\\.uploads", "php.*업로드"]
      points: 10
      note: 웹셸을 찾았는가 (입구일 뿐이므로 배점이 낮다)
    - id: per-timestomp
      type: keyword
      any: ["ctime", "mtime", "시각.*위조", "타임스톰", "timestomp", "stat"]
      points: 20
      note: 시각 위조를 간파했는가 — 이걸 놓치면 타임라인이 통째로 틀린다
    - id: per-cron
      type: keyword
      any: ["cron", "크론", "apt-compat", "주기.*실행", "스케줄"]
      points: 20
      note: cron 지속성을 찾았는가
    - id: per-key
      type: keyword
      any: ["authorized_keys", "공개키", "ssh.*키", "backup@ext-backup"]
      points: 20
      note: SSH 키 지속성을 찾았는가
    - id: per-setuid
      type: keyword
      any: ["setuid", "4755", "systemd-private", "perm -4000", "권한.*비트"]
      points: 20
      note: setuid 셸 사본을 찾았는가
    - id: per-fim
      type: keyword
      any: ["FIM", "무결성", "syscheck", "파일.*변경.*경보", "Wazuh"]
      points: 5
      note: FIM 경보를 근거로 썼는가 (손으로만 찾는 것보다 재현 가능하다)
    - id: per-act
      type: evidence_kind
      kind: action
      points: 5
      note: 조치를 실행했는가

  forbidden:
    - "(웹셸|파일).*(삭제|제거).*(완료|종결|끝)"
    - "1월|2024-01.*(오래된|기존|무관)"

expected_actions:
  - WAF 접근 로그에서 해당 경로의 최초 요청 시각을 특정
  - 파일을 지우기 전에 stat 으로 mtime/ctime/atime 을 모두 기록 (지우면 끝이다)
  - ctime 기준으로 실제 침해 시각을 다시 잡고 그 시각 전후를 재조사
  - /etc/cron.d · /etc/sudoers.d · authorized_keys · setuid 파일을 전수 점검
  - Wazuh FIM 경보를 시간순으로 정렬해 손으로 찾은 것과 대조 (빠뜨린 것 확인)
  - 지속성 수단을 모두 제거한 뒤에야 웹셸 제거 — 순서가 반대면 공격자가 눈치챈다
